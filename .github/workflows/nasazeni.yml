# Po každém nahrání do větve main vygeneruje web a nahraje ho přes FTP na Váš Hosting.
# Přístupové údaje jsou v GitHubu: Settings → Secrets and variables → Actions
#   tajné (Secrets):    FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   nepovinné (Variables): FTP_DIR (složka webu na FTP, výchozí www)
name: Nasazení na hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasazeni
  cancel-in-progress: false

jobs:
  nasazeni:
    runs-on: ubuntu-latest
    env:
      MA_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Vygenerovat web
        run: python3 build.py

      - name: Připravit soubory k nahrání
        run: |
          mkdir _site
          cp -r index.html robots.txt archiv sekce _site/

      - name: Chybí přístup k FTP
        if: env.MA_FTP != 'true'
        run: echo "::notice::Web nebyl nahrán, v GitHubu chybí tajné údaje FTP_SERVER, FTP_USERNAME a FTP_PASSWORD."

      - name: Nahrát přes FTP
        if: env.MA_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'www' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp > /dev/null
          # Šifrované FTP (FTPS) pro přihlášení i přenos souborů. Na serveru se jen
          # nahrávají a přepisují soubory webu, nic se nemaže.
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          cd "$FTP_DIR"
          mirror --reverse --no-perms --verbose _site .
          bye
          EOF
